<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felipe Oliboni</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text y=%22.9em%22 font-size=%2280%22 fill=%22%2300ffff%22 font-family=%22monospace%22 font-weight=%22bold%22>>_</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #00ffff;
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated;
            margin: 0;
            overflow-x: hidden;
        }

        /* Fundo da Placa Mãe */
        #circuit-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        .pixel-button {
            position: relative;
            display: inline-block;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #00ffff;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: #00ffff;
            font-size: 12px;
            margin: 10px;
            z-index: 20;
        }

        .pixel-button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 8px 8px 0px #ffffff;
            transform: translate(-4px, -4px);
        }

        .pixel-button:active {
            transform: translate(0px, 0px);
            box-shadow: none;
        }

        .email-link {
            font-size: 10px;
            color: #ff00ff;
            text-decoration: none;
            border-bottom: 2px solid #ff00ff;
        }

        .email-link:hover {
            color: #fff;
            border-color: #fff;
        }

        .scanline {
            width: 100%;
            height: 100%;
            z-index: 50;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            position: fixed;
            pointer-events: none;
        }

        .flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        main {
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen flicker">
    <canvas id="circuit-bg"></canvas>
    <div class="scanline"></div>

    <!-- Link de Contacto e Switcher de Idioma -->
    <div class="fixed top-[20px] right-[20px] flex flex-col items-end gap-2 z-30">
        <div class="relative inline-block text-right">
            <button onclick="toggleContactMenu(event)" class="email-link tracking-tighter uppercase cursor-pointer bg-transparent border-0 p-0 flex items-center gap-1.5 ml-auto" data-i18n="contact">
                Contact_Me <span id="contact-arrow" class="text-[8px] inline-block transition-transform duration-200">▼</span>
            </button>
            <div id="contact-dropdown" class="max-h-0 opacity-0 overflow-hidden transition-all duration-300 ease-in-out absolute right-0 mt-2 w-56 z-40 text-left shadow-[4px_4px_0px_#ff00ff]">
                <div class="border-2 border-[#ff00ff] p-3 flex flex-col gap-2 bg-black/95">
                    <a href="mailto:foliboni@gmail.com" target="_blank" class="text-[10px] text-[#00ffff] hover:text-white flex items-center gap-2 py-1.5 px-2 hover:bg-[#ff00ff]/20 transition-colors uppercase border-b border-[#ff00ff]/30">
                        <span class="text-[#ff00ff]">></span> Email
                    </a>
                    <a href="https://wa.me/5554999777842" target="_blank" class="text-[10px] text-[#25D366] hover:text-white flex items-center gap-2 py-1.5 px-2 hover:bg-[#25D366]/20 transition-colors uppercase">
                        <span class="text-[#25D366]">></span> WhatsApp
                    </a>
                </div>
            </div>
        </div>
        <div class="flex gap-3 text-[10px] tracking-tighter">
            <button onclick="setLanguage('pt')" class="lang-btn text-[#ff00ff] hover:text-white transition-colors cursor-pointer" id="lang-pt">PT</button>
            <button onclick="setLanguage('en')" class="lang-btn text-[#ff00ff] hover:text-white transition-colors cursor-pointer" id="lang-en">EN</button>
            <button onclick="setLanguage('it')" class="lang-btn text-[#ff00ff] hover:text-white transition-colors cursor-pointer" id="lang-it">IT</button>
        </div>
    </div>

    <!-- Conteúdo Central -->
    <main class="text-center p-6 bg-black/40 backdrop-blur-sm rounded-lg border-4 border-cyan-500/20 py-12 px-8">
        <div class="mb-8">
            <h1 class="text-2xl md:text-4xl mb-4 tracking-tighter uppercase">
                Felipe Oliboni
            </h1>
        </div>

        <div class="flex flex-row flex-nowrap justify-center items-center gap-2 md:gap-4 max-w-2xl mx-auto">
            <a href="https://linkedin.com/in/felipeoliboni" target="_blank" class="pixel-button uppercase !m-0 whitespace-nowrap text-[10px] md:text-xs px-3 py-2.5 md:px-5 md:py-3">
                LinkedIn
            </a>
            <a href="https://github.com/felipeoliboni" target="_blank" class="pixel-button uppercase !m-0 whitespace-nowrap text-[10px] md:text-xs px-3 py-2.5 md:px-5 md:py-3">
                GitHub
            </a>
            <a href="resume.html" class="pixel-button uppercase !m-0 whitespace-nowrap text-[10px] md:text-xs px-3 py-2.5 md:px-5 md:py-3" data-i18n="resume">
                Currículo
            </a>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script>
        function toggleContactMenu(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('contact-dropdown');
            const arrow = document.getElementById('contact-arrow');
            if (dropdown) {
                const isExpanded = dropdown.classList.contains('menu-expanded');
                if (isExpanded) {
                    dropdown.classList.remove('menu-expanded');
                    dropdown.style.maxHeight = '0px';
                    dropdown.style.opacity = '0';
                    if (arrow) arrow.style.transform = 'rotate(0deg)';
                } else {
                    dropdown.classList.add('menu-expanded');
                    dropdown.style.maxHeight = '150px';
                    dropdown.style.opacity = '1';
                    if (arrow) arrow.style.transform = 'rotate(180deg)';
                }
            }
        }

        document.addEventListener('click', (event) => {
            const dropdown = document.getElementById('contact-dropdown');
            const toggleBtn = document.querySelector('[data-i18n="contact"]');
            const arrow = document.getElementById('contact-arrow');
            if (dropdown && dropdown.classList.contains('menu-expanded') && !dropdown.contains(event.target) && (!toggleBtn || !toggleBtn.contains(event.target))) {
                dropdown.classList.remove('menu-expanded');
                dropdown.style.maxHeight = '0px';
                dropdown.style.opacity = '0';
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        });
    </script>

    <script>
        const canvas = document.getElementById('circuit-bg');
        const ctx = canvas.getContext('2d');

        let width, height;
        const cellSize = 20;
        const circuits = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Circuit {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.floor(Math.random() * (width / cellSize)) * cellSize;
                this.y = Math.floor(Math.random() * (height / cellSize)) * cellSize;
                this.path = [];
                this.len = Math.floor(Math.random() * 10) + 5;
                this.history = [];
                this.age = 0;
                this.maxAge = 100 + Math.random() * 100;
                this.color = Math.random() > 0.5 ? '#00ffff' : '#008888';
                
                let cx = this.x;
                let cy = this.y;
                
                for(let i=0; i<this.len; i++) {
                    this.path.push({x: cx, y: cy});
                    const dir = Math.floor(Math.random() * 4);
                    if(dir === 0) cx += cellSize;
                    else if(dir === 1) cx -= cellSize;
                    else if(dir === 2) cy += cellSize;
                    else cy -= cellSize;
                }
            }

            draw() {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let i=0; i<this.path.length - 1; i++) {
                    ctx.moveTo(this.path[i].x, this.path[i].y);
                    ctx.lineTo(this.path[i+1].x, this.path[i+1].y);
                }
                ctx.stroke();

                // Desenhar o "bit" a correr no caminho
                const posIndex = Math.floor((this.age / this.maxAge) * (this.path.length - 1));
                if(posIndex < this.path.length - 1) {
                    const p1 = this.path[posIndex];
                    const p2 = this.path[posIndex + 1];
                    const progress = (this.age / this.maxAge * (this.path.length - 1)) % 1;
                    
                    const bx = p1.x + (p2.x - p1.x) * progress;
                    const by = p1.y + (p2.y - p1.y) * progress;
                    
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(bx - 2, by - 2, 4, 4);
                }
            }

            update() {
                this.age++;
                if(this.age > this.maxAge) {
                    this.reset();
                }
            }
        }

        for(let i=0; i<20; i++) {
            circuits.push(new Circuit());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Desenhar grelha pixelada de fundo (subtil)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for(let x=0; x<width; x+=cellSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for(let y=0; y<height; y+=cellSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            circuits.forEach(c => {
                c.update();
                c.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
